<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Request a demo | Ledgerline</title>
<style>
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;margin:0;background:#f4f1ec;color:#1b1b1b}
.wrap{max-width:560px;margin:30px auto;background:#fff;padding:28px 32px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h1{font-size:26px;margin:0 0 6px} .lede{color:#555;margin:0 0 18px}
label,legend{display:block;font-size:13px;font-weight:500;margin:12px 0 5px}
.row{display:flex;gap:12px} .row>div{flex:1}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],select,textarea{width:100%;padding:10px;font-size:15px;box-sizing:border-box;border:1px solid #cfc8bd;border-radius:8px}
fieldset{border:0;padding:0;margin:12px 0} fieldset label{font-weight:400;font-size:14px;margin:6px 0}
.check{font-size:12px;color:#555;margin:14px 0} .check label{display:inline;font-size:12px;font-weight:400}
button{margin-top:16px;width:100%;padding:13px;font-size:15px;background:#1b1b1b;color:#fff;border:0;border-radius:8px}
</style></head><body>
<!-- Invented SaaS demo-request form (B24 corpus). Submit is inert. -->
<div class="wrap">
<h1>See Ledgerline in action</h1>
<p class="lede">Tell us a little about your team and we'll set up a 30-minute walkthrough.</p>
<form onsubmit="event.preventDefault()">
<div class="row">
 <div><label for="fn">First name*</label><input type="text" id="fn" autocomplete="off"></div>
 <div><label for="ln">Last name*</label><input type="text" id="ln" autocomplete="off"></div>
</div>
<label for="em">Work email*</label><input type="email" id="em" autocomplete="off">
<label for="ph">Phone number</label><input type="tel" id="ph" autocomplete="off">
<div class="row">
 <div><label for="co">Company name*</label><input type="text" id="co" autocomplete="off"></div>
 <div><label for="jt">Job title*</label><input type="text" id="jt" autocomplete="off"></div>
</div>
<label for="web">Company website</label><input type="url" id="web" autocomplete="off" placeholder="https://">
<div class="row">
 <div><label for="size">Number of employees*</label>
  <select id="size"><option value="">Select one</option><option>1-10</option><option>11-50</option><option>51-200</option><option>201-1,000</option><option>1,001+</option></select></div>
 <div><label for="ctry">Country*</label>
  <select id="ctry"><option value="">Select one</option><option>United States</option><option>Canada</option><option>United Kingdom</option><option>Ireland</option><option>Australia</option><option>Other</option></select></div>
</div>
<fieldset><legend>What are you interested in?</legend>
<label><input type="checkbox" name="int" value="ap"> Accounts payable automation</label>
<label><input type="checkbox" name="int" value="exp"> Expense management</label>
<label><input type="checkbox" name="int" value="proc"> Procurement</label>
</fieldset>
<label for="when">Preferred demo date (optional)</label><input type="date" id="when">
<label for="more">Anything else we should know?</label><textarea id="more" rows="3"></textarea>
<div class="check"><input type="checkbox" id="mkt"> <label for="mkt">I'd like to receive product news and marketing emails from Ledgerline. You can unsubscribe at any time.</label></div>
<button type="submit">Request demo</button>
</form>
</div>
</body></html>
