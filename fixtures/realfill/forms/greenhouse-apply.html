<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Software Engineer Intern (Q1 local test)</title>
<style>
body{font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:720px;margin:24px auto;color:#222}
h1{font-size:22px} label{display:block;font-weight:600;margin:14px 0 4px} .req{color:#c00}
input[type=text],input[type=email],input[type=tel],input[type=url],select{width:100%;padding:8px;font-size:14px;box-sizing:border-box;border:1px solid #bbb;border-radius:4px}
.rs{border:1px solid #bbb;border-radius:4px;padding:8px;display:flex;justify-content:space-between}
.rs input{border:0;outline:0;font-size:14px;width:2px}
button{margin-top:20px;padding:10px 18px;font-size:15px;background:#0b6;color:#fff;border:0;border-radius:4px}
</style></head><body>
<!-- Replica of ~/.caret-run/evidence/q1/tools/apply.html. The two react-select widgets are a static copy of
     react-select 5's markup (an input with role combobox inside a styled control), so the page needs no
     network; they stay named hand-offs. -->
<h1>Software Engineer Intern</h1>
<p>Local test page in the style of a Greenhouse application. Submit only records the click on this page; nothing is sent.</p>
<form id="f" autocomplete="off" onsubmit="event.preventDefault()">
<label for="first_name">First Name <span class="req">*</span></label><input type="text" id="first_name" name="first_name">
<label for="last_name">Last Name <span class="req">*</span></label><input type="text" id="last_name" name="last_name">
<label for="email">Email <span class="req">*</span></label><input type="email" id="email" name="email">
<label for="phone">Phone</label><input type="tel" id="phone" name="phone">
<label for="resume">Resume/CV <span class="req">*</span></label><input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx,.txt">
<label id="school-label">School <span class="req">*</span></label>
<div class="rs"><div><div class="ph" aria-hidden="true">Select...</div><input id="school-input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="school-label" autocapitalize="none" autocomplete="off" spellcheck="false" tabindex="0" type="text" value=""></div><span aria-hidden="true">&#9662;</span></div>
<label for="degree">Degree <span class="req">*</span></label>
<select id="degree" name="degree"><option value="">Select...</option><option>Associate's Degree</option><option>Bachelor's Degree</option><option>Master's Degree</option><option>Doctorate</option><option>Other</option></select>
<label for="grad">Graduation Date (MM/YYYY)</label><input type="text" id="grad" name="grad">
<label id="auth-label">Are you legally authorized to work in the United States? <span class="req">*</span></label>
<div class="rs"><div><div class="ph" aria-hidden="true">Select...</div><input id="auth-input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="auth-label" autocapitalize="none" autocomplete="off" spellcheck="false" tabindex="0" type="text" value=""></div><span aria-hidden="true">&#9662;</span></div>
<label for="linkedin">LinkedIn Profile</label><input type="url" id="linkedin" name="linkedin">
<button type="submit" id="submit">Submit application</button>
</form>
</body></html>
