name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    name: Mac build
    # SwiftUI's glassEffect requires Xcode 26; Package.swift still targets macOS 14.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned KeyType UI dependency
        run: git submodule update --init --depth 1 packages/keytype
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - run: swift test --package-path apps/mac
      # No Xcode packaging build here: scripts/privacy_gate.sh invokes
      # helper/scripts/privacy-gate.ts, which intentionally refuses release packaging
      # while the pv2-sites-send and ha2-copied-conversation acceptance records are null.
