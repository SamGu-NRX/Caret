name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    name: Mac build
    # SwiftUI's glassEffect requires Xcode 26; Package.swift still targets macOS 14.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned KeyType UI dependency
        run: git submodule update --init --depth 1 packages/keytype
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - run: swift test --package-path apps/mac
      # Check the packaged app's project under the Debug-only internal exemption in
      # scripts/privacy_gate.sh and helper/scripts/privacy-gate.ts. Release packaging
      # still waits for the pv2-sites-send and ha2-copied-conversation acceptance records.
      - name: Build the packaged app in internal mode
        env:
          CARET_INTERNAL_BUILD: '1'
        # The local-store gate refuses Xcode's default ~/Library/Developer output root.
        run: xcodebuild -quiet -project Caret.xcodeproj -scheme Caret -configuration Debug -derivedDataPath .local/xcode-ci -destination 'platform=macOS' CODE_SIGN_IDENTITY=- build
