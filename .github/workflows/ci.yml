name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make test
      - run: python3 scripts/check_sources.py
      - run: python3 -m caret preview --fixture fixtures/meeting.json
  mac:
    name: Mac build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path apps/mac
