# CodeRabbit settings for the Caret v2 review stack. Generated notes and snapshot images aren't
# reviewable code, and counting them pushed every v2 PR over CodeRabbit's 100-file limit.
reviews:
  auto_review:
    drafts: true
  path_filters:
    - "!.summem/**"
    - "!**/*.png"
    - "!**/pnpm-lock.yaml"
