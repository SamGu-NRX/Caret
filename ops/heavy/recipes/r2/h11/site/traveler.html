<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Traveler information</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Traveler information</h1><p>Guest-local test page in the style of an airline's guest passenger form. Continue only records the click.</p>
<form id="f" autocomplete="off">
<label for="first">First name</label><input type="text" id="first" name="first">
<label for="last">Last name</label><input type="text" id="last" name="last">
<label for="email">Email</label><input type="email" id="email" name="email">
<label for="phone">Mobile phone</label><input type="tel" id="phone" name="phone">
<label for="dob">Date of birth</label><input type="date" id="dob" name="dob">
<button type="submit" id="submit">Continue</button><div id="log"></div>
</form><script src="guard.js"></script></body></html>
