<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Contact sales</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Talk to sales</h1><p>Guest-local test page in the style of a HubSpot contact form. Submit only records the click.</p>
<form id="f" autocomplete="off">
<label for="firstname">First name <span class="req">*</span></label><input type="text" id="firstname" name="firstname">
<label for="lastname">Last name <span class="req">*</span></label><input type="text" id="lastname" name="lastname">
<label for="email">Email <span class="req">*</span></label><input type="email" id="email" name="email">
<label for="company">Company name</label><input type="text" id="company" name="company">
<label for="message">How can we help?</label><textarea id="message" name="message" rows="3"></textarea>
<button type="submit" id="submit">Submit</button><div id="log"></div>
</form><script src="guard.js"></script></body></html>
