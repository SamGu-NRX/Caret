<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Apply: Software Engineer Intern</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Software Engineer Intern</h1><p>Guest-local test page in the style of a Greenhouse application. Submit only records the click.</p>
<form id="f" autocomplete="off">
<label for="first_name">First Name <span class="req">*</span></label><input type="text" id="first_name" name="first_name">
<label for="last_name">Last Name <span class="req">*</span></label><input type="text" id="last_name" name="last_name">
<label for="email">Email <span class="req">*</span></label><input type="email" id="email" name="email">
<label for="phone">Phone</label><input type="tel" id="phone" name="phone">
<label for="resume">Resume/CV <span class="req">*</span></label><input type="file" id="resume" name="resume" accept=".pdf,.txt">
<label id="school-label">School <span class="req">*</span></label><div id="school"></div>
<label for="degree">Degree <span class="req">*</span></label>
<select id="degree" name="degree"><option value="">Select...</option><option>Associate's Degree</option><option>Bachelor's Degree</option><option>Master's Degree</option><option>Doctorate</option><option>Other</option></select>
<label for="grad">Graduation Date (MM/YYYY)</label><input type="text" id="grad" name="grad">
<fieldset><legend>Are you legally authorized to work in the United States? <span class="req">*</span></legend>
<label><input type="radio" name="auth" value="yes" id="auth_yes"> Yes</label><label><input type="radio" name="auth" value="no" id="auth_no"> No</label></fieldset>
<label for="linkedin">LinkedIn Profile</label><input type="url" id="linkedin" name="linkedin">
<button type="submit" id="submit">Submit application</button><div id="log"></div>
</form>
<script src="combobox.js"></script><script src="guard.js"></script>
<script>combobox(document.getElementById('school'),'school-input','school-label',["Massachusetts Institute of Technology","Stanford University","The University of Texas at Austin","University of California, Berkeley","University of Michigan","Other"]);</script>
</body></html>
